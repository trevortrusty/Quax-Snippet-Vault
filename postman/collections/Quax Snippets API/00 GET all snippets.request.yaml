$kind: http-request
method: GET
url: '{{base_url}}/api/snippets'
order: 750
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('returns an array', () => pm.expect(body).to.be.an('array'));
      pm.test('every snippet has the expected shape', () => {
        body.forEach((s) => {
          pm.expect(s).to.have.all.keys('id', 'title', 'language', 'tags', 'code');
          pm.expect(s.tags).to.be.an('array');
        });
      });
      pm.test('ids are unique', () => {
        const ids = body.map((s) => s.id);
        pm.expect(new Set(ids).size).to.eql(ids.length);
      });
      pm.test('contains the id used by later requests', () => {
        const ids = body.map((s) => s.id);
        pm.expect(ids).to.include(pm.collectionVariables.get('snippet_id'));
      });
