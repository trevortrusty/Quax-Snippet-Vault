$kind: http-request
method: POST
url: '{{base_url}}/api/snippets'
order: 14000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"title":"t","language":"jsx"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('error message present', () => pm.expect(pm.response.json().error).to.be.a('string').and.not.empty);
